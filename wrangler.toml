name = "remotejobs"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Cron trigger: every 3 hours
[triggers]
crons = ["0 */3 * * *"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "careerhub"
database_id = "40906884-2e1a-4590-8457-f79cdeae7f51"

# Environment variables (secrets via wrangler secret put)
[vars]
SITE_NAME = "CAREERHUB"
# ADMIN_SECRET set via: wrangler secret put ADMIN_SECRET
