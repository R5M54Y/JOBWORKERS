name = "jobworkers"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Cron trigger: daily at midnight UTC
[triggers]
crons = ["0 0 * * *"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "remotejobs"
database_id = "aff78497-930d-4fe1-a576-1cb80928dd6f"

# Environment variables (secrets via wrangler secret put)
[vars]
# ADMIN_SECRET set via: wrangler secret put ADMIN_SECRET
