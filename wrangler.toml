name = "jobworkers"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Cron trigger: daily at midnight UTC
[triggers]
crons = ["0 0 * * *"]

# Environment variables (secrets via wrangler secret put)
[vars]
# DATABASE_URL set via: wrangler secret put DATABASE_URL
